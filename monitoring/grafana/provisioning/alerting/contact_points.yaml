apiVersion: 1

contactPoints:
  - orgId: 1
    name: equipe-mlops
    receivers:
      - uid: slack-mlops
        type: slack
        settings:
          url: $__env{GF_SLACK_WEBHOOK}

policies:
  - orgId: 1
    receiver: equipe-mlops
    group_by: ['alertname', 'job']
    group_wait: 30s
    group_interval: 5m 
    repeat_interval: 4h
