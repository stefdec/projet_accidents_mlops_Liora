global:
  scrape_interval: 30s

scrape_configs:
  - job_name: "sustainability"
    static_configs:
      - targets:
          - "sustainability-exporter:8002"

  - job_name: "drift_monitoring"
    static_configs:
      - targets:
          - "drift-exporter:8001"

  - job_name: "ml_monitoring"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "ml-exporter:8003"

  - job_name: "predict_api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "predict-api:8000"

  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

